[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gvrnn-te"
version = "0.2.0"
description = "GVRNN per-player latent chain extraction + pairwise/substitute transfer entropy (TE) + causal-emergence bridge (Rosas 2020) for football tracking data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "torch>=2.0",
    "matplotlib>=3.5",
    "vi-te @ git+https://github.com/han-jiahe/vi-te.git",
]
authors = [{ name = "han-jiahe" }]

[project.urls]
Homepage = "https://github.com/han-jiahe/gvrnn-te"

[tool.setuptools]
packages = ["mte", "gvrnn", "te_emergence"]
py-modules = [
    "config",
    "data_loading",
    "run_player_mte",
    "run_player_te",
    "latent_phase",
    "phase_te",
    "latent_pair_te",
    "te_scale_compare",
    "run_subs_te",
]
